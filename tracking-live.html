<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XANDROS LIVE</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#060d1a;color:#fff}#top{background:#0a1628;padding:12px;border-left:4px solid #00e676;font-size:13px;line-height:1.5}#map{height:65vh;width:100%}</style></head><body>
<div id="top">
<b>WB-XL-2026-0930-001 | CHRIST NAIDOO</b><br>
Pretoria → Durban • 100KG Rhodium 99.99%<br>
🚛 ARM-02 <span id="speed">74 km/h</span> | <span id="status" style="color:#00e676;font-weight:900;">● LIVE MOVING - N3 Highway</span><br>
<span id="ping">Last Ping: NOW | ETA Durban: 4h 58m | SIGNAL STRONG</span>
</div>
<div id="map"></div>
<div id="driverPanel" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#000;border-top:3px solid #ffc107;padding:15px;z-index:9999;text-align:center;">
<b style="color:#ffc107;">🚛 DRIVER ARM-02 - TAP TO STOP</b><br><br>
<button onclick="setS('STOPPED - PARKED N3')" style="background:#ff3d00;color:#fff;padding:14px 20px;border-radius:25px;border:none;margin:5px;font-weight:900;font-size:15px;">🛑 STOP TRUCK</button>
<button onclick="setS('LIVE MOVING - N3 Highway')" style="background:#00e676;color:#000;padding:14px 20px;border-radius:25px;border:none;margin:5px;font-weight:900;font-size:15px;">▶️ RESUME</button>
<button onclick="setS('ARRIVED DURBAN - DELIVERED ✅')" style="background:#ffc107;color:#000;padding:14px 20px;border-radius:25px;border:none;margin:5px;font-weight:900;font-size:15px;">✅ DELIVERED</button>
</div>
<script>
var map=L.map('map').setView([-26.5,29.5],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
var pretoria=[-25.7479,28.2293];var durban=[-29.8587,31.0218];
L.polyline([pretoria,[-26.5,28.8],[-27.8,29.5],durban],{color:'#ffc107',weight:3,dashArray:'10,10'}).addTo(map);
var truckIcon=L.divIcon({html:'🚚',className:'',iconSize:[30,30]});var marker=L.marker(pretoria,{icon:truckIcon}).addTo(map);L.marker(durban).addTo(map);
if(window.location.href.includes('driver=1'))document.getElementById('driverPanel').style.display='block';
function setS(s){localStorage.setItem('xandros_status',s);localStorage.setItem('xandros_speed',s.includes('STOPPED')?'0 km/h - PARKED':s.includes('ARRIVED')?'0 km/h - DELIVERED':'77 km/h');localStorage.setItem('xandros_time',new Date().toLocaleTimeString('en-ZA',{hour12:false})+' SAST');alert('✅ Set to: '+s);location.reload();}
let st=localStorage.getItem('xandros_status');let sp=localStorage.getItem('xandros_speed');let tm=localStorage.getItem('xandros_time');
if(st){document.getElementById('status').innerText='● '+st;document.getElementById('status').style.color=st.includes('STOPPED')?'#ff3d00':st.includes('ARRIVED')?'#ffc107':'#00e676';}
if(sp){document.getElementById('speed').innerText=sp;}
if(tm){document.getElementById('ping').innerText='Last Ping: '+tm+' | '+ (st.includes('ARRIVED')?'DELIVERED':'ETA Durban: 4h 58m')+' | SIGNAL STRONG';}
</script></body></html>
