n.getCurrentPosition(ok,err,{enableHighAccuracy:true,timeout:15000,maximumAge:0});setInterval(()=>navigator.geolocation.getCurrentPosition(ok,err=>L("update err "+err.message),{enableHighAccuracy:true,timeout:10000}),6000);}</script></body></html>
