<!-- DRIVER PANEL - Only you see it with ?driver=1 -->
<div id="driverPanel" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#000;border-top:2px solid #ffc107;padding:12px;z-index:9999;">
  <b style="color:#ffc107;">🚛 DRIVER CONTROL - ARM-02</b><br>
  <button onclick="setDriverStatus('STOPPED')" style="background:#ff3d00;color:#fff;padding:10px 15px;border-radius:20px;border:none;margin:5px;font-weight:900;">🛑 STOPPED / PARKED</button>
  <button onclick="setDriverStatus('LIVE MOVING')" style="background:#00e676;color:#000;padding:10px 15px;border-radius:20px;border:none;margin:5px;font-weight:900;">▶️ RESUME MOVING</button>
  <button onclick="setDriverStatus('ARRIVED DURBAN')" style="background:#ffc107;color:#000;padding:10px 15px;border-radius:20px;border:none;margin:5px;font-weight:900;">✅ ARRIVED</button>
  <button onclick="setDriverStatus('EMERGENCY')" style="background:#d50000;color:#fff;padding:10px 15px;border-radius:20px;border:none;margin:5px;font-weight:900;">🚨 EMERGENCY</button>
</div>
<script>
// Show driver panel if ?driver=1 in URL
if(window.location.href.includes('driver=1')){document.getElementById('driverPanel').style.display='block';}
function setDriverStatus(s){
  localStorage.setItem('xandros_status', s);
  localStorage.setItem('xandros_lastPing', new Date().toLocaleTimeString('en-ZA')+' SAST');
  alert('Status set to: '+s+'\nClient will see: '+s);
  location.reload();
}
// Read driver status
let saved = localStorage.getItem('xandros_status');
if(saved){ 
  // Override the text that shows LIVE MOVING
  setTimeout(()=>{
    document.body.innerHTML = document.body.innerHTML.replace(/LIVE MOVING/g, saved);
    if(saved=='STOPPED') document.body.innerHTML = document.body.innerHTML.replace(/85 km\/h/g, '0 km/h - PARKED');
  },500);
}
</script>
