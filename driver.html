<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>XANDROS DRIVER</title><style>body{background:#0a1628;color:#fff;font-family:Arial;padding:20px;text-align:center}button{background:#00e676;color:#000;padding:20px 40px;border:none;border-radius:12px;font-size:22px;font-weight:900;margin:10px}</style></head><body><h2>XANDROS<br>WB-XL-2026-0930-001</h2><p id="status">Ready to share LIVE GPS</p><p id="coords"></p><button onclick="start()">🟢 START LIVE GPS</button><br><button style="background:#ff3d00;color:#fff" onclick="stop()">STOP</button><script>let w=null;const T="xandros-WB-XL-2026-0930-001";function start(){document.getElementById("status").innerText="📡 LIVE SHARING TO CUSTOMER...";w=navigator.geolocation.watchPosition(p=>{let d={lat:p.coords.latitude,lng:p.coords.longitude,spd:(p.coords.speed||20)*3.6,t:new Date().toISOString()};document.getElementById("coords").innerHTML=d.lat.toFixed(5)+", "+d.lng.toFixed(5)+"<br>"+d.spd.toFixed(0)+" km/h";fetch("https://ntfy.sh/"+T,{method:"POST",body:JSON.stringify(d)});},{e=>alert(e.message)},{enableHighAccuracy:true});}function stop(){if(w)navigator.geolocation.clearWatch(w);document.getElementById("status").innerText="STOPPED";}</script></body></html>
